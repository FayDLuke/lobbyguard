[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-lobby-protect"
version = "1.2.0"
description = "Lobby protection for Endstone: no block breaking, no mob spawning, and void teleport."
requires-python = ">=3.10"
dependencies = ["tomlkit>=0.12"]
authors = [{ name = "Lobby Protect" }]

[project.entry-points."endstone"]
lobby-protect = "endstone_lobby_protect:LobbyProtectPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_lobby_protect"]
