# ==========================================================
#  Lobby Protect - config.toml
#  Setelah edit, jalankan /lobbyprotect reload (atau restart server)
# ==========================================================

[lobby]
# Nama dimension tempat lobby berada: "Overworld", "Nether", atau "TheEnd"
dimension = "Overworld"

# Batas area lobby (sumbu X dan Z saja, Y tidak dibatasi).
# enabled = false  -> SELURUH dimension di atas dianggap area lobby.
# enabled = true   -> hanya kotak X/Z di bawah ini yang dianggap lobby.
[lobby.area]
enabled = false
min-x = -100.0
max-x = 100.0
min-z = -100.0
max-z = 100.0

[protection]
# Fitur 1: pemain tidak bisa break block di area lobby
block-break = true

# Pemain dengan permission "lobby_protect.bypass" (default: OP) boleh break block.
# Set false kalau OP juga TIDAK boleh break di lobby.
allow-bypass = true

# Fitur 2: semua mob tidak bisa spawn di area lobby
mob-spawn = true

# Tipe entity yang TIDAK ikut diblokir spawn-nya (mis. NPC / armor stand dekorasi lobby).
# Hapus isinya (jadi []) kalau benar-benar semua mob harus diblokir.
mob-spawn-whitelist = ["minecraft:npc", "minecraft:armor_stand"]

# Fitur 3: kalau pemain di area lobby berada DI BAWAH koordinat Y tertentu,
# otomatis di-teleport ke koordinat tujuan.
[void-teleport]
enabled = true
below-y = 250.0

# Seberapa sering dicek (dalam tick, 20 tick = 1 detik)
check-interval-ticks = 5

[void-teleport.destination]
x = 0.5
y = 260.0
z = 0.5
yaw = 0.0
pitch = 0.0
# Kosongkan ("") untuk memakai dimension lobby di atas
dimension = ""

[messages]
# Kosongkan ("") untuk mematikan pesan
break-denied = "§cKamu tidak bisa menghancurkan block di lobby!"
teleported = ""
